  - GEOSITE,category-ai-!cn,🧠 AI
  - GEOSITE,paypal,🟨 USBank
  - RULE-SET,paypal,🟨 USBank
  - RULE-SET,BankUS_Domain,🟨 USBank
  - RULE-SET,VirtualFinance,🟨 USBank
  - GEOSITE,OKX,🟨 USBank
  - GEOSITE,Binance,🟨 USBank
  - GEOSITE,Bybit,🟨 USBank
  - GEOSITE,cloudflare,选择代理
  - GEOIP,cloudflare,选择代理,no-resolve
  - GEOSITE,category-communication,选择代理
  - GEOSITE,category-social-media-!cn,选择代理
  # YouTube
